name: Update Full TW Stock List

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pandas requests lxml
      - run: python update_list.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tw_stocks.csv
          git commit -m "Update full TW stock list" || exit 0
          git push
